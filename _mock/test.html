<!doctype html><meta charset="utf-8"><title>apps script test</title>
<pre id="out" style="font:13px/1.5 monospace">running…</pre>
<script>
var store = {};
var sheetCalls = 0, sheetWrites = [];
var cells = { B4:'만천초등학교', H4:'주무관', L4:'홍태현', C5:'2026-11-30 08:40 ~ 16:40', C6:'강원진로교육원', C15:1, C21:'주유영수증1매', C23:'2026-12-01', C24:'홍태현' };
var SpreadsheetApp = { flush:function(){}, openById:function(){ return { getSheets:function(){return []}, getSheetByName:function(){ return {
  getName:function(){return '여비 정산 신청서'},
  getRange:function(a1){ sheetCalls++; return {
    getValue:function(){ var v = cells[a1]; return v===undefined ? '' : v; },
    setValue:function(v){ sheetWrites.push([a1, v]); cells[a1]=v; }
  }; }
}; } }; } };
var Utilities = { formatDate:function(){ return '2026-11-23 15:30:00'; } };
var PropertiesService = { getScriptProperties:function(){ return {
  getProperty:function(k){ return store[k]===undefined ? null : store[k]; },
  setProperty:function(k,v){ store[k]=v; },
  deleteProperty:function(k){ delete store[k]; }
}; } };
var ContentService = { MimeType:{JSON:'json'}, createTextOutput:function(t){ var o={ _t:t, setMimeType:function(){return o;}, getContent:function(){return o._t;} }; return o; } };
var LockService = { getScriptLock:function(){ return { waitLock:function(){}, releaseLock:function(){} }; } };
</script>
<script src="travel-apps-script.js"></script>
<script>
var R = [];
function junit(res){ return JSON.parse(res.getContent()); }
function ok(name, cond, extra){ R.push((cond?'PASS':'FAIL') + ' | ' + name + (extra!==undefined ? ' :: '+extra : '')); }
function post(o){ return junit(doPost({ postData:{ contents: JSON.stringify(o) } })); }
function state(){ return junit(doGet({ parameter:{ action:'state' } })); }

try{
  ok('처음엔 typing 없음', state().typing === undefined);
  sheetCalls = 0;
  var r1 = post({ action:'typing', clientId:'cA', who:'홍태현', typing:true });
  ok('typing POST 성공', r1.ok === true, JSON.stringify(r1).slice(0,60));
  ok('typing POST는 시트를 안 건드림', sheetCalls === 0, 'getRange 호출 '+sheetCalls);
  var s1 = state();
  ok('state에 typing 실림', !!s1.typing && s1.typing.clientId==='cA' && s1.typing.who==='홍태현' && s1.typing.ageMs>=0, JSON.stringify(s1.typing));
  post({ action:'typing', clientId:'cB', typing:false });
  ok('남의 신호는 안 지움', !!state().typing);
  post({ action:'typing', clientId:'cA', typing:false });
  ok('내 신호는 지움', state().typing === undefined);
  store.TRAVEL_TYPING = JSON.stringify({ clientId:'cA', who:'x', ts:new Date().getTime()-9001 });
  ok('9초 지난 신호는 숨김', state().typing === undefined);
  store.TRAVEL_TYPING = JSON.stringify({ clientId:'cA', who:'x', ts:new Date().getTime()-5000 });
  ok('5초 전 신호는 보임', !!state().typing);
  post({ action:'typing', clientId:'cC', who:' 가\n나 다라마바사아자차카타파하가나다라마 ', typing:true });
  var t6 = state().typing;
  ok('who 줄바꿈·길이 정리', t6.who.indexOf('\n') < 0 && t6.who.length <= 20, JSON.stringify(t6.who));
  sheetWrites.length = 0; sheetCalls = 0;
  var r7 = post({ action:'batchUpdate', clientId:'cA', updates:[{field:'destination', value:'춘천교육지원청'}], typing:true, who:'홍태현' });
  ok('batchUpdate 정상', r7.ok === true && r7.saved === 1, JSON.stringify(r7));
  ok('batchUpdate가 셀에 씀', cells.C6 === '춘천교육지원청', String(cells.C6));
  ok('batchUpdate에 실린 typing도 반영', !!state().typing);
  sheetWrites.length = 0;
  post({ action:'batchUpdate', updates:[{field:'applyDate', value:'2026-12-03'}] });
  ok('날짜 칸은 Date로 저장', cells.C23 instanceof Date, String(cells.C23));
  ok('모르는 action은 오류', post({ action:'zzz' }).ok === false);
  var p = junit(doGet({ parameter:{ action:'ping' } }));
  ok('ping 그대로', p.ok === true && p.fields === 40, JSON.stringify(p).slice(0,50));
  var st = state();
  ok('state values 그대로', st.ok === true && st.values && st.values.name === '홍태현', String(st.values && st.values.name));
}catch(e){ R.push('ERROR | ' + e.message + ' @ ' + (e.stack||'').split('\n')[1]); }
document.getElementById('out').textContent = R.join('\n') + '\n\n' + R.filter(function(x){return x.indexOf('PASS')===0;}).length + '/' + R.length + ' 통과';
</script>
